<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>碰撞层 · 共振链预听</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel2: #1c232d;
    --line: #2a3340;
    --text: #e6edf3;
    --muted: #9aa7b4;
    --accent: #4cc2ff;
    --good: #3fb950;
    --bad: #f85149;
    --warn: #d29922;
    --trace: #ffb86b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  header { padding: 18px 24px 8px; }
  header h1 { margin: 0 0 4px; font-size: 18px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  main { padding: 12px 24px 32px; max-width: 1180px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
  }
  .panel h2 { margin: 0 0 12px; font-size: 14px; color: var(--accent); letter-spacing: .3px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
  .row label { color: var(--muted); }
  .row b { font-variant-numeric: tabular-nums; }
  button {
    width: 100%;
    margin: 6px 0;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel2);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: #14334a; border-color: #1f5f86; }
  button.primary:hover { background: #17405e; }
  .budget-ok { color: var(--good); }
  .budget-bad { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; color: var(--muted); }
  .chart-wrap { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  canvas { width: 100%; height: 260px; display: block; }
  .legend { display: flex; gap: 16px; margin-top: 8px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .lg-chain::before { background: var(--accent); }
  .lg-env::before { background: var(--trace); }
  .lg-zero::before { background: var(--good); }
  .lg-delay::before { background: #b083f0; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .metric { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .metric .k { color: var(--muted); font-size: 12px; }
  .metric .v { font-size: 18px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .tag.muted { color: var(--warn); border-color: #5c4a1e; background: #241d0c; }
  .note { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .section-list { max-height: 180px; overflow: auto; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
  .section-list div { display: flex; justify-content: space-between; padding: 2px 0; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>碰撞层 · 峰值滤波共振链预听</h1>
  <p>离线渲染上下文：单声道 · <span id="hdr-rate"></span> Hz · <span id="hdr-frames"></span> 点 ·
     <span id="hdr-dur"></span> ms。同一套上下文，所有关卡共用。</p>
</header>
<main>
  <div class="grid">
    <section class="panel">
      <h2>接线 / 渲染控制</h2>
      <div class="row"><label>链档位</label><b id="cur-sections">—</b></div>
      <button class="primary" id="btn-400">接 400 节并预听（再点 4 次计时）</button>
      <button id="btn-200">接 200 节并预听</button>
      <button id="btn-loop0">不带延迟回路（上下文静音）</button>
      <button id="btn-loop10">10 ms 延迟回路</button>

      <h2 style="margin-top:18px">接线耗时（每次点击）</h2>
      <table id="wire-table">
        <thead><tr><th>点击</th><th>节数</th><th>接线 ms</th><th>预算</th><th>结果</th></tr></thead>
        <tbody></tbody>
      </table>

      <h2 style="margin-top:18px">渲染往返（开始渲染 → 采样回来）</h2>
      <table id="render-table">
        <thead><tr><th>点击</th><th>节数</th><th>往返 ms</th><th>预算</th><th>结果</th></tr></thead>
        <tbody></tbody>
      </table>

      <div class="section-list" id="section-list"></div>
    </section>

    <section class="panel">
      <h2 id="chart-title">采样波形（按时间）</h2>
      <div class="chart-wrap">
        <canvas id="chart" width="1080" height="260"></canvas>
      </div>
      <div class="legend">
        <span class="lg-chain">链输出采样</span>
        <span class="lg-env">音量包络 0.2 → 0.05</span>
        <span class="lg-zero">无延迟回路（全零）</span>
        <span class="lg-delay">10 ms 延迟回路</span>
      </div>

      <div class="metrics">
        <div class="metric"><div class="k">时长 (ms)</div><div class="v" id="m-ms">—</div></div>
        <div class="metric"><div class="k">绝对值和</div><div class="v" id="m-abs">—</div></div>
        <div class="metric"><div class="k">峰值</div><div class="v" id="m-peak">—</div></div>
      </div>
      <div class="note" id="m-note">页面上的毫秒、绝对值和、峰值都从当前画出的这次采样实时计算。</div>
    </section>
  </div>
</main>

<script src="../engine/core.js"></script>
<script src="app.js"></script>
</body>
</html>
